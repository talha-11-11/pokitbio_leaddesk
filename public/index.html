<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PokitBio</title>
<meta name="theme-color" content="#004AAD" />
<meta name="application-name" content="PokitBio" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script src="/vendor/chart.umd.js" defer></script>
<style>
  :root {
    --main: #FF7878; --sec: #004AAD; --white: #fff;
    --ink: #0f1d33; --muted: #5d6b82; --line: #e4e9f2; --bg: #f5f7fb;
    --soft-main: #fff1f1; --soft-sec: #eaf1fc; --good: #137a3a; --soft-good: #e3f7ea; --warn: #9a5b00; --soft-warn: #fff4e0;
    --radius: 12px; --side: 230px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--sec); }
  .hidden { display: none !important; }

  /* ---------- layout ---------- */
  .side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--sec); color: #fff; display: flex; flex-direction: column; z-index: 6; }
  .side .brand { padding: 16px 14px 14px; }
  .side .brand img { width: 100%; display: block; border-radius: 10px; }
  .topbar .tlogo { height: 34px; border-radius: 7px; display: block; }
  .brand span { color: var(--main); }
  .side nav { display: grid; gap: 2px; padding: 0 10px; }
  .side a.nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #dbe6ff; text-decoration: none; font-weight: 600; }
  .side a.nav:hover { background: rgba(255,255,255,.08); }
  .side a.nav.active { background: var(--white); color: var(--sec); }
  .side a.nav .ic { width: 22px; text-align: center; }
  .side .foot { margin-top: auto; padding: 14px 16px; font-size: 12px; color: #b9cbf2; display: grid; gap: 8px; }
  .side .foot button { background: rgba(255,255,255,.12); border: 0; color: #fff; padding: 8px; border-radius: 8px; font-weight: 600; }

  .topbar { display: none; }
  .wrap { margin-left: var(--side); min-height: 100vh; }
  .pagehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 18px 24px 6px; }
  .pagehead h1 { margin: 0; font-size: 22px; color: var(--sec); }
  .pagehead .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  main { padding: 10px 24px 40px; max-width: 1400px; }

  .bottomnav { display: none; }

  @media (max-width: 860px) {
    .side { display: none; }
    .wrap { margin-left: 0; padding-bottom: calc(68px + var(--safe-b)); }
    .topbar { display: flex; align-items: center; gap: 10px; background: var(--sec); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
    .topbar .brand { font-weight: 800; font-size: 18px; }
    .topbar .tb-actions { margin-left: auto; display: flex; gap: 6px; }
    .topbar .tb-actions button { background: rgba(255,255,255,.15); border: 0; color: #fff; border-radius: 8px; padding: 6px 10px; font-weight: 600; }
    .pagehead { padding: 14px 14px 4px; }
    .pagehead h1 { font-size: 19px; }
    main { padding: 8px 12px 24px; }
    .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--white); border-top: 1px solid var(--line); z-index: 8; padding-bottom: var(--safe-b); }
    .bottomnav a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 9px; font-size: 11px; color: var(--muted); text-decoration: none; font-weight: 600; }
    .bottomnav a .ic { font-size: 19px; line-height: 1; }
    .bottomnav a.active { color: var(--sec); }
    .bottomnav a.active .ic { transform: translateY(-1px); }
  }

  /* ---------- common ---------- */
  .grid { display: grid; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 1100px) { .tiles.four { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1250px) { .tiles.five { grid-template-columns: repeat(5, 1fr); } }
  #alerts { max-height: 300px; overflow-y: auto; }
  .tile { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile.click { cursor: pointer; }
  .tile .l { color: var(--muted); font-size: 12px; }
  .tile .n { font-size: 22px; font-weight: 800; color: var(--sec); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .tile.red .n { color: var(--main); } .tile.green .n { color: var(--good); }
  @media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tile .n { font-size: 18px; } }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); }
  .card > h3, .card .ch { margin: 0; padding: 12px 14px; font-size: 14px; color: var(--sec); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card .ch .r { margin-left: auto; }
  .card .cb { padding: 12px 14px; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cols3 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  @media (max-width: 1000px) { .cols2, .cols3 { grid-template-columns: 1fr; } }

  .btn { background: var(--sec); color: var(--white); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; white-space: nowrap; }
  .btn.main { background: var(--main); }
  .btn.light { background: var(--white); color: var(--sec); border: 1px solid var(--line); }
  .btn.ghost { background: transparent; color: var(--sec); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.danger { background: var(--white); color: var(--main); border: 1px solid var(--line); }
  .btn:disabled { opacity: .6; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar input, .toolbar select, .inp { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); min-width: 0; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
  .tab { background: none; border: 0; padding: 9px 14px; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--sec); border-color: var(--main); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chip { border: 1px solid var(--line); background: var(--white); border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .chip.active { background: var(--sec); color: #fff; border-color: var(--sec); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafbfe; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.row { cursor: pointer; } tr.row:hover td { background: var(--soft-sec); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .tscroll { overflow-x: auto; }

  .list .li { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .list .li:last-child { border-bottom: 0; }
  .list .li:active { background: var(--soft-sec); }
  .li .grow { flex: 1; min-width: 0; }
  .li .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .amt { font-weight: 700; white-space: nowrap; text-align: right; }

  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--soft-main); color: var(--main); display: grid; place-items: center; font-weight: 700; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 12px; }
  .who .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .snip { color: var(--muted); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .s-new { background: var(--soft-main); color: #c94444; }
  .s-contacted { background: var(--soft-sec); color: var(--sec); }
  .s-demo_sent { background: var(--sec); color: var(--white); }
  .s-negotiation { background: var(--soft-warn); color: var(--warn); }
  .s-won { background: var(--soft-good); color: var(--good); }
  .s-lost { background: #eef0f4; color: #6b7280; }
  .b-good { background: var(--soft-good); color: var(--good); } .b-bad { background: var(--soft-main); color: #c94444; } .b-warn { background: var(--soft-warn); color: var(--warn); } .b-info { background: var(--soft-sec); color: var(--sec); } .b-mute { background: #eef0f4; color: #6b7280; }
  .plat { font-size: 12px; font-weight: 600; }
  .plat.messenger { color: var(--sec); } .plat.instagram { color: var(--main); } .plat.manual { color: var(--muted); }
  .unread { background: var(--main); color: var(--white); border-radius: 99px; font-size: 11px; padding: 0 7px; margin-left: 6px; }
  .over { color: var(--main); font-weight: 700; } .today { color: var(--warn); font-weight: 700; } .good { color: var(--good); font-weight: 700; } .bad { color: var(--main); font-weight: 700; }
  .no { color: #b4bccb; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.up { background: #22c55e; } .dot.down { background: var(--main); } .dot.unk { background: #c3cad6; }
  .chk { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: var(--sec); }
  select.st { border: 0; border-radius: 99px; padding: 3px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .alert { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .alert:last-child { border-bottom: 0; }
  .alert .ic { font-size: 18px; }
  .chartbox { position: relative; height: 240px; }
  .bar { height: 8px; border-radius: 99px; background: var(--soft-sec); overflow: hidden; }
  .bar > div { height: 100%; background: var(--sec); border-radius: 99px; }

  /* leads: table on laptop, cards on phone */
  .leads-cards { display: none; }
  @media (max-width: 860px) {
    .leads-table { display: none; }
    .leads-cards { display: block; }
    .lc { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .lc .top { display: flex; gap: 10px; align-items: flex-start; }
    .lc .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; padding-left: 46px; font-size: 12px; }
  }

  /* pipeline */
  .board { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: #eef2f9; border-radius: var(--radius); padding: 8px; min-height: 200px; }
  .col h4 { margin: 4px 4px 8px; font-size: 13px; display: flex; justify-content: space-between; }
  .col.drop { outline: 2px dashed var(--main); }
  .kcard { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 7px; cursor: grab; }

  /* drawer + modal */
  .scrim { position: fixed; inset: 0; background: rgba(15,29,51,.4); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
  .dhead { background: var(--white); padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 2; }
  .dhead .avatar { width: 46px; height: 46px; font-size: 18px; }
  .x { margin-left: auto; background: none; border: 0; font-size: 28px; color: var(--muted); line-height: 1; padding: 0 4px; }
  .dbody { padding: 14px 16px 40px; display: grid; gap: 12px; }
  .sec { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .sec h3 { margin: 0 0 10px; font-size: 14px; color: var(--sec); display: flex; align-items: center; gap: 8px; }
  .sec h3 .r { margin-left: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select, label.f textarea, textarea.inp { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); width: 100%; font-size: 14px; }
  label.f.full { grid-column: 1 / -1; }
  .stepper { display: flex; gap: 6px; flex-wrap: wrap; }
  .step { border: 1px solid var(--line); background: var(--white); border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .step.active { background: var(--sec); color: var(--white); border-color: var(--sec); }
  .step.won.active { background: var(--good); border-color: var(--good); }
  .step.lost.active { background: #6b7280; border-color: #6b7280; }
  .milestone { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
  .milestone .tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #eef0f4; color: #9aa3b2; font-weight: 700; flex: none; }
  .milestone.done .tick { background: var(--sec); color: var(--white); }
  .milestone input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin-left: auto; }
  .items { display: grid; gap: 8px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: flex; gap: 10px; align-items: flex-start; }
  .item .grow { flex: 1; min-width: 0; }
  .item.activity { background: #fafbfe; border-style: dashed; }
  .item.call { border-left: 3px solid var(--main); }
  .item.demo { border-left: 3px solid var(--sec); }
  .item .del { background: none; border: 0; color: #b4bccb; font-size: 16px; }
  .item .del:hover { color: var(--main); }
  .item.done .grow { text-decoration: line-through; color: var(--muted); }
  .addrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .addrow input[type=text], .addrow textarea, .addrow select { flex: 1; min-width: 160px; }
  .addrow input, .addrow select, .addrow textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fff; }
  .chat { display: grid; gap: 6px; max-height: 420px; overflow-y: auto; padding: 4px; }
  .bubble { max-width: 80%; padding: 8px 11px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.in { background: #eef2f9; justify-self: start; border-bottom-left-radius: 4px; }
  .bubble.out { background: var(--sec); color: var(--white); justify-self: end; border-bottom-right-radius: 4px; }
  .bubble .t { font-size: 10px; opacity: .65; margin-top: 3px; }

  .modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: rgba(15,29,51,.45); padding: 16px; }
  .modal .box { background: var(--white); border-radius: 14px; padding: 18px; width: min(520px, 100%); max-height: 92vh; overflow-y: auto; display: grid; gap: 10px; }
  .modal h2 { margin: 0; color: var(--sec); font-size: 18px; }
  .modal .mact { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .modal .mact .left { margin-right: auto; }
  @media (max-width: 860px) {
    .modal { place-items: end stretch; padding: 0; }
    .modal .box { width: 100%; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + var(--safe-b)); max-height: 90vh; }
    .grid2 { grid-template-columns: 1fr; }
    .drawer { width: 100%; }
  }
  .sheet a { display: flex; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 600; }
  .sheet a .ic { width: 26px; text-align: center; font-size: 18px; }

  #toast { position: fixed; bottom: calc(84px + var(--safe-b)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 9px 16px; border-radius: 8px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  @media (min-width: 861px) { #toast { bottom: 20px; } }
</style>
</head>
<body>

<div id="login" class="modal" style="place-items:center">
  <form class="box" id="loginForm" style="border-radius:14px;width:min(400px,100%)">
    <img src="/logo-wordmark.png" alt="PokitBio" style="width:100%;border-radius:12px;display:block" />
    <div class="sub">Business app — enter your password</div>
    <label class="f">Password <input type="password" id="pw" required autofocus /></label>
    <button class="btn main">Open</button>
    <div id="loginErr" class="bad hidden">Wrong password</div>
  </form>
</div>

<aside class="side">
  <div class="brand"><img src="/logo-wordmark.png" alt="PokitBio" /></div>
  <nav id="sideNav"></nav>
  <div class="foot">
    <button id="installBtn" class="hidden">⬇ Install app</button>
    <div>talha@pokitbio.com</div>
  </div>
</aside>

<div class="wrap">
  <div class="topbar">
    <img class="tlogo" src="/logo-wordmark.png" alt="PokitBio" />
    <div class="tb-actions">
      <button id="installBtnM" class="hidden">⬇ Install</button>
      <button id="quickBtn">＋ Add</button>
    </div>
  </div>
  <div class="pagehead"><h1 id="pageTitle"></h1><div class="actions" id="pageActions"></div></div>
  <main id="view"></main>
</div>

<nav class="bottomnav" id="bottomNav"></nav>

<div id="scrim" class="scrim hidden"></div>
<aside id="drawer" class="drawer hidden"></aside>
<div id="modalRoot"></div>
<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
