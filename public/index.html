<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PokitBio Lead Desk</title>
<style>
  :root {
    --main: #FF7878; --sec: #004AAD; --white: #fff;
    --ink: #0f1d33; --muted: #5d6b82; --line: #e4e9f2; --bg: #f5f7fb;
    --soft-main: #fff1f1; --soft-sec: #eaf1fc;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  header { background: var(--sec); color: var(--white); padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; }
  .brand span { color: var(--main); }
  .conn { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .pill { padding: 3px 10px; border-radius: 99px; font-size: 12px; background: rgba(255,255,255,.14); }
  .pill.on::before { content: "●"; color: #7dffb0; margin-right: 5px; }
  .pill.off::before { content: "●"; color: var(--main); margin-right: 5px; }
  .hbtn { background: var(--white); color: var(--sec); border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 600; }
  .hbtn.ghost { background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,.5); }

  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; }
  .stat .n { font-size: 24px; font-weight: 700; color: var(--sec); }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat.alert .n { color: var(--main); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tab { background: none; border: 0; padding: 9px 14px; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; }
  .tab.active { color: var(--sec); border-color: var(--main); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
  .toolbar input { flex: 1; min-width: 180px; }
  .btn { background: var(--sec); color: var(--white); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; }
  .btn.main { background: var(--main); }
  .btn.light { background: var(--white); color: var(--sec); border: 1px solid var(--line); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafbfe; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--soft-sec); }
  .who { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--soft-main); color: var(--main); display: grid; place-items: center; font-weight: 700; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-weight: 600; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; }
  .snip { color: var(--muted); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .s-new { background: var(--soft-main); color: #c94444; }
  .s-contacted { background: var(--soft-sec); color: var(--sec); }
  .s-demo_sent { background: var(--sec); color: var(--white); }
  .s-negotiation { background: #fff4e0; color: #9a5b00; }
  .s-won { background: #e3f7ea; color: #137a3a; }
  .s-lost { background: #eef0f4; color: #6b7280; }
  .plat { font-size: 12px; font-weight: 600; }
  .plat.messenger { color: var(--sec); }
  .plat.instagram { color: var(--main); }
  .plat.manual { color: var(--muted); }
  .unread { background: var(--main); color: var(--white); border-radius: 99px; font-size: 11px; padding: 0 7px; margin-left: 6px; }
  .yes { color: #137a3a; font-weight: 600; }
  .no { color: #b4bccb; }
  .over { color: var(--main); font-weight: 700; }
  .today { color: #9a5b00; font-weight: 700; }
  input.cell { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 7px; width: 140px; color: var(--ink); }
  input.cell:hover, input.cell:focus { border-color: var(--line); background: var(--white); outline: none; }
  input.cell::placeholder { color: #c3cad6; }
  select.cell.st { border: 0; border-radius: 99px; padding: 3px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .chk { display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--sec); cursor: pointer; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  /* pipeline */
  .board { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: #eef2f9; border-radius: var(--radius); padding: 8px; min-height: 200px; }
  .col h4 { margin: 4px 4px 8px; font-size: 13px; display: flex; justify-content: space-between; }
  .col.drop { outline: 2px dashed var(--main); }
  .kcard { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 7px; cursor: grab; }
  .kcard .snip { max-width: 100%; }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(15,29,51,.35); z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 11; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
  .dhead { background: var(--white); padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; position: sticky; top: 0; z-index: 2; }
  .dhead .avatar { width: 46px; height: 46px; font-size: 18px; }
  .x { margin-left: auto; background: none; border: 0; font-size: 26px; color: var(--muted); line-height: 1; }
  .dbody { padding: 16px 20px; display: grid; gap: 14px; }
  .sec { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .sec h3 { margin: 0 0 10px; font-size: 14px; color: var(--sec); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f input, label.f select, textarea { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); width: 100%; }
  .stepper { display: flex; gap: 6px; flex-wrap: wrap; }
  .step { border: 1px solid var(--line); background: var(--white); border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .step.active { background: var(--sec); color: var(--white); border-color: var(--sec); }
  .step.won.active { background: #137a3a; border-color: #137a3a; }
  .step.lost.active { background: #6b7280; border-color: #6b7280; }
  .milestone { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .milestone .tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #eef0f4; color: #9aa3b2; font-weight: 700; flex: none; }
  .milestone.done .tick { background: var(--sec); color: var(--white); }
  .milestone input { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; margin-left: auto; }
  .list { display: grid; gap: 8px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: flex; gap: 10px; align-items: flex-start; }
  .item .grow { flex: 1; }
  .item.activity { background: #fafbfe; border-style: dashed; }
  .item .del { background: none; border: 0; color: #b4bccb; font-size: 16px; }
  .item .del:hover { color: var(--main); }
  .item.done .grow { text-decoration: line-through; color: var(--muted); }
  .addrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .addrow input[type=text], .addrow textarea { flex: 1; min-width: 180px; }
  .addrow input[type=date], .addrow input[type=datetime-local] { border: 1px solid var(--line); border-radius: 8px; padding: 7px; }
  .chat { display: grid; gap: 6px; max-height: 420px; overflow-y: auto; padding: 4px; }
  .bubble { max-width: 78%; padding: 8px 11px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.in { background: #eef2f9; justify-self: start; border-bottom-left-radius: 4px; }
  .bubble.out { background: var(--sec); color: var(--white); justify-self: end; border-bottom-right-radius: 4px; }
  .bubble .t { font-size: 10px; opacity: .65; margin-top: 3px; }

  .modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: rgba(15,29,51,.45); padding: 16px; }
  .modal .box { background: var(--white); border-radius: 14px; padding: 20px; width: min(440px, 100%); display: grid; gap: 10px; }
  .modal h2 { margin: 0 0 4px; color: var(--sec); font-size: 18px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 9px 16px; border-radius: 8px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }

  @media (max-width: 760px) {
    .hide-sm { display: none; }
    .grid2 { grid-template-columns: 1fr; }
    header { padding: 12px 14px; }
    .conn { margin-left: 0; width: 100%; order: 3; }
  }
</style>
</head>
<body>

<!-- login -->
<div id="login" class="modal">
  <form class="box" id="loginForm">
    <h2>PokitBio Lead Desk</h2>
    <div class="sub">Enter your dashboard password</div>
    <label class="f">Password <input type="password" id="pw" required autofocus /></label>
    <button class="btn main">Open dashboard</button>
    <div id="loginErr" class="over hidden">Wrong password</div>
  </form>
</div>

<header>
  <div class="brand">Pokit<span>Bio</span> Lead Desk</div>
  <div class="conn">
    <span class="pill" id="pillFb">Messenger</span>
    <span class="pill" id="pillIg">Instagram</span>
  </div>
  <button class="hbtn ghost" id="syncBtn" title="Import existing conversations from Meta">⟳ Sync inbox</button>
  <button class="hbtn" id="addBtn">+ Lead</button>
</header>

<main>
  <section class="stats" id="stats"></section>

  <nav class="tabs">
    <button class="tab active" data-view="leads">Leads</button>
    <button class="tab" data-view="followups">Follow-ups</button>
    <button class="tab" data-view="pipeline">Pipeline</button>
  </nav>

  <!-- leads view -->
  <section id="view-leads">
    <div class="toolbar">
      <input id="search" placeholder="Search name, phone, business, message, tag…" />
      <select id="fStatus"><option value="all">All statuses</option></select>
      <select id="fPlatform">
        <option value="all">All sources</option>
        <option value="messenger">Messenger</option>
        <option value="instagram">Instagram</option>
        <option value="manual">Manual</option>
      </select>
      <select id="fQuick">
        <option value="">Any</option>
        <option value="notcontacted">Not contacted yet</option>
        <option value="nodemo">Contacted, no demo yet</option>
        <option value="overdue">Follow-up overdue</option>
      </select>
      <button class="btn light" id="exportBtn">Export CSV</button>
    </div>
    <div class="card"><div style="overflow-x:auto"><table>
      <thead><tr>
        <th>Lead</th><th>Phone</th><th>Business</th><th>Source</th><th>Status</th><th>Contacted</th><th>Demo sent</th><th>Next follow-up</th><th class="hide-sm">Last message</th>
      </tr></thead>
      <tbody id="leadRows"></tbody>
    </table></div></div>
  </section>

  <!-- followups view -->
  <section id="view-followups" class="hidden">
    <div class="card" id="fuList"></div>
  </section>

  <!-- pipeline view -->
  <section id="view-pipeline" class="hidden">
    <div class="board" id="board"></div>
  </section>
</main>

<!-- lead drawer -->
<div id="scrim" class="scrim hidden"></div>
<aside id="drawer" class="drawer hidden"></aside>

<!-- add lead modal -->
<div id="addModal" class="modal hidden">
  <form class="box" id="addForm">
    <h2>Add lead manually</h2>
    <label class="f">Name * <input name="name" required /></label>
    <div class="grid2">
      <label class="f">Phone / WhatsApp <input name="phone" /></label>
      <label class="f">Email <input name="email" type="email" /></label>
    </div>
    <div class="grid2">
      <label class="f">Business <input name="business" /></label>
      <label class="f">Source
        <select name="platform"><option value="manual">Manual / referral</option><option value="messenger">Messenger</option><option value="instagram">Instagram</option></select>
      </label>
    </div>
    <label class="f">Interested in <input name="interest" placeholder="e.g. CRM, AI chatbot, POS app" /></label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="btn light" id="addCancel">Cancel</button>
      <button class="btn main">Save lead</button>
    </div>
  </form>
</div>

<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let KEY = '';
try { KEY = localStorage.getItem('pb_key') || ''; } catch {}
let CONFIG = { statuses: [] }, LEADS = [], CURRENT = null, VIEW = 'leads';

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY, ...(opts.headers || {}) },
    body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body });
  if (r.status === 401) { showLogin(true); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
}

// ---- dates ----
const todayStr = () => new Date().toLocaleDateString('en-CA');
const dayOf = (iso) => (iso ? new Date(iso).toLocaleDateString('en-CA') : '');
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtDateTime(iso) { if (!iso) return ''; return new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function rel(iso) {
  if (!iso) return '';
  const d = Math.round((new Date(iso) - Date.now()) / 6e4);
  const a = Math.abs(d);
  if (a < 60) return d <= 0 ? `${a}m ago` : `in ${a}m`;
  if (a < 1440) return d <= 0 ? `${Math.round(a / 60)}h ago` : `in ${Math.round(a / 60)}h`;
  return d <= 0 ? `${Math.round(a / 1440)}d ago` : `in ${Math.round(a / 1440)}d`;
}
function fuClass(iso) { if (!iso) return ''; const d = dayOf(iso), t = todayStr(); return d < t ? 'over' : d === t ? 'today' : ''; }
// date input (yyyy-mm-dd) -> ISO at local noon so the day never shifts
const dateToIso = (v) => (v ? new Date(v + 'T12:00:00').toISOString() : null);

const statusLabel = (s) => CONFIG.statuses.find((x) => x.id === s)?.label || s;
const badge = (s) => `<span class="badge s-${s}">${esc(statusLabel(s))}</span>`;
const platLabel = { messenger: 'Messenger', instagram: 'Instagram', manual: 'Manual' };
function avatar(l) {
  const init = (l.name || l.username || '?').trim()[0]?.toUpperCase() || '?';
  return `<div class="avatar">${l.profile_pic ? `<img src="${esc(l.profile_pic)}" onerror="this.remove()" alt="">` : ''}${l.profile_pic ? '' : init}</div>`;
}
const displayName = (l) => esc(l.name || (l.username ? '@' + l.username : 'Unknown user'));

// ---- login ----
function showLogin(err) { $('#login').classList.remove('hidden'); $('#loginErr').classList.toggle('hidden', !err); }
$('#loginForm').onsubmit = async (e) => {
  e.preventDefault(); KEY = $('#pw').value;
  try { await api('/api/config'); try { localStorage.setItem('pb_key', KEY); } catch {} $('#login').classList.add('hidden'); boot(); }
  catch { $('#loginErr').classList.remove('hidden'); }
};

// ---- boot ----
async function boot() {
  CONFIG = await api('/api/config');
  $('#login').classList.add('hidden');
  $('#fStatus').innerHTML = '<option value="all">All statuses</option>' + CONFIG.statuses.map((s) => `<option value="${s.id}">${s.label}</option>`).join('');
  $('#pillFb').className = 'pill ' + (CONFIG.meta.pageConnected ? 'on' : 'off');
  $('#pillIg').className = 'pill ' + (CONFIG.meta.igConnected ? 'on' : 'off');
  refresh();
  setInterval(() => { if (!document.hidden) refresh(true); }, 20000); // live-ish updates
}
async function refresh(silent) {
  try {
    await Promise.all([loadStats(), loadLeads()]);
    if (VIEW === 'followups') loadFollowups();
    if (CURRENT && !silent) openLead(CURRENT);
  } catch (e) { if (!silent) toast(e.message); }
}

async function loadStats() {
  const s = await api('/api/stats');
  const tiles = [
    ['Total leads', s.total, () => resetFilters()],
    ['New this week', s.newThisWeek, () => resetFilters()],
    ['Not contacted yet', s.notContacted, () => setQuick('notcontacted'), s.notContacted > 0],
    ['Demos sent', s.demosSent, () => { resetFilters(); $('#fStatus').value = 'demo_sent'; loadLeads(); }],
    ['Follow-ups today', s.dueToday, () => switchView('followups')],
    ['Overdue follow-ups', s.overdue, () => setQuick('overdue'), s.overdue > 0],
    ['Won', s.byStatus.won || 0, () => { resetFilters(); $('#fStatus').value = 'won'; loadLeads(); }],
  ];
  const el = $('#stats'); el.innerHTML = '';
  tiles.forEach(([l, n, fn, alert]) => {
    const d = document.createElement('div'); d.className = 'stat' + (alert ? ' alert' : '');
    d.innerHTML = `<div class="n">${n}</div><div class="l">${l}</div>`; d.onclick = () => { switchView('leads'); fn(); }; el.appendChild(d);
  });
}
function resetFilters() { $('#search').value = ''; $('#fStatus').value = 'all'; $('#fPlatform').value = 'all'; $('#fQuick').value = ''; loadLeads(); }
function setQuick(v) { resetFilters(); $('#fQuick').value = v; renderLeads(); }

async function loadLeads() {
  const p = new URLSearchParams({ status: $('#fStatus').value, platform: $('#fPlatform').value, q: $('#search').value.trim() });
  LEADS = await api('/api/leads?' + p);
  renderLeads();
  if (VIEW === 'pipeline') renderBoard();
}
function quickFilter(list) {
  const qf = $('#fQuick').value, t = todayStr();
  if (qf === 'notcontacted') return list.filter((l) => !l.contacted_at && !['won', 'lost'].includes(l.status));
  if (qf === 'nodemo') return list.filter((l) => l.contacted_at && !l.demo_sent_at && !['won', 'lost'].includes(l.status));
  if (qf === 'overdue') return list.filter((l) => l.next_followup_at && dayOf(l.next_followup_at) < t);
  return list;
}
function renderLeads() {
  const list = quickFilter(LEADS);
  $('#leadRows').innerHTML = list.length ? list.map((l) => `
    <tr class="row" data-id="${l.id}">
      <td><div class="who">${avatar(l)}<div><div class="name">${displayName(l)}${l.unread ? `<span class="unread">${l.unread}</span>` : ''}</div>
        <div class="sub">${esc(l.username ? '@' + l.username : fmtDate(l.created_at))}</div></div></div></td>
      <td class="ed"><input class="cell" data-cell="phone" data-id="${l.id}" value="${esc(l.phone || '')}" placeholder="add phone" /></td>
      <td class="ed"><input class="cell" data-cell="business" data-id="${l.id}" value="${esc(l.business || '')}" placeholder="add business" /></td>
      <td><span class="plat ${l.platform}">${platLabel[l.platform] || l.platform}</span></td>
      <td class="ed"><select class="cell st s-${l.status}" data-cell="status" data-id="${l.id}">${CONFIG.statuses.map((s) => `<option value="${s.id}" ${s.id === l.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></td>
      <td class="ed"><label class="chk"><input type="checkbox" data-mark="contacted_at" data-id="${l.id}" ${l.contacted_at ? 'checked' : ''} /> <span class="sub">${l.contacted_at ? fmtDate(l.contacted_at) : 'No'}</span></label></td>
      <td class="ed"><label class="chk"><input type="checkbox" data-mark="demo_sent_at" data-id="${l.id}" ${l.demo_sent_at ? 'checked' : ''} /> <span class="sub">${l.demo_sent_at ? fmtDate(l.demo_sent_at) : 'No'}</span></label></td>
      <td>${l.next_followup_at ? `<span class="${fuClass(l.next_followup_at)}">${fmtDate(l.next_followup_at)}</span>${l.next_followup_note ? `<div class="sub snip">${esc(l.next_followup_note)}</div>` : ''}` : '<span class="no">—</span>'}</td>
      <td class="hide-sm"><div class="snip">${l.last_direction === 'out' ? 'You: ' : ''}${esc(l.last_message || '')}</div><div class="sub">${rel(l.last_message_at)}</div></td>
    </tr>`).join('') : `<tr><td colspan="9" class="empty">No leads yet. Messages sent to your Facebook page or Instagram will appear here automatically.</td></tr>`;
  $$('#leadRows tr.row').forEach((tr) => (tr.onclick = () => openLead(+tr.dataset.id)));
  $$('#leadRows td.ed').forEach((td) => (td.onclick = (e) => e.stopPropagation()));
  $$('#leadRows [data-cell]').forEach((el) => (el.onchange = async () => {
    await api('/api/leads/' + el.dataset.id, { method: 'PATCH', body: { [el.dataset.cell]: el.value.trim() } });
    toast('Saved'); refresh(true);
  }));
  $$('#leadRows [data-mark]').forEach((cb) => (cb.onchange = async () => {
    await api('/api/leads/' + cb.dataset.id, { method: 'PATCH', body: { [cb.dataset.mark]: cb.checked ? new Date().toISOString() : null } });
    toast(cb.checked ? (cb.dataset.mark === 'contacted_at' ? 'Marked contacted' : 'Marked demo sent') : 'Cleared'); refresh(true);
  }));
}

// ---- pipeline ----
function renderBoard() {
  const b = $('#board');
  b.innerHTML = CONFIG.statuses.map((s) => {
    const items = LEADS.filter((l) => l.status === s.id);
    return `<div class="col" data-status="${s.id}"><h4>${s.label}<span class="sub">${items.length}</span></h4>
      ${items.map((l) => `<div class="kcard" draggable="true" data-id="${l.id}">
        <div class="who">${avatar(l)}<div style="min-width:0"><div class="name">${displayName(l)}</div><div class="sub plat ${l.platform}">${platLabel[l.platform]}</div></div></div>
        ${l.next_followup_at ? `<div class="sub" style="margin-top:6px">Follow-up: <span class="${fuClass(l.next_followup_at)}">${fmtDate(l.next_followup_at)}</span></div>` : ''}
      </div>`).join('')}</div>`;
  }).join('');
  $$('.kcard', b).forEach((c) => {
    c.onclick = () => openLead(+c.dataset.id);
    c.ondragstart = (e) => e.dataTransfer.setData('id', c.dataset.id);
  });
  $$('.col', b).forEach((col) => {
    col.ondragover = (e) => { e.preventDefault(); col.classList.add('drop'); };
    col.ondragleave = () => col.classList.remove('drop');
    col.ondrop = async (e) => {
      e.preventDefault(); col.classList.remove('drop');
      await api('/api/leads/' + e.dataTransfer.getData('id'), { method: 'PATCH', body: { status: col.dataset.status } });
      toast('Moved to ' + statusLabel(col.dataset.status)); refresh(true);
    };
  });
}

// ---- followups tab ----
async function loadFollowups() {
  const list = await api('/api/followups');
  const t = todayStr();
  const groups = { Overdue: [], Today: [], Upcoming: [] };
  list.forEach((f) => { const d = dayOf(f.due_at); (d < t ? groups.Overdue : d === t ? groups.Today : groups.Upcoming).push(f); });
  $('#fuList').innerHTML = list.length ? Object.entries(groups).filter(([, v]) => v.length).map(([g, v]) => `
    <div style="padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;color:${g === 'Overdue' ? 'var(--main)' : 'var(--sec)'}">${g} (${v.length})</div>
    ${v.map((f) => `<div class="item" style="border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0">
      <div class="grow" style="cursor:pointer" data-open="${f.lead_id}"><div class="name">${esc(f.name || 'Unknown')} <span class="plat ${f.platform}" style="margin-left:6px">${platLabel[f.platform]}</span> ${badge(f.status)}</div>
      <div class="sub">${fmtDate(f.due_at)} ${f.note ? '— ' + esc(f.note) : ''}</div></div>
      <button class="btn sm" data-done="${f.id}">✓ Done</button></div>`).join('')}`).join('')
    : '<div class="empty">No pending follow-ups 🎉</div>';
  $$('[data-open]', $('#fuList')).forEach((el) => (el.onclick = () => openLead(+el.dataset.open)));
  $$('[data-done]', $('#fuList')).forEach((el) => (el.onclick = async () => { await api('/api/followups/' + el.dataset.done, { method: 'PATCH', body: { done: true } }); toast('Follow-up done'); loadFollowups(); loadStats(); loadLeads(); }));
}

// ---- lead drawer ----
async function openLead(id) {
  CURRENT = id;
  const l = await api('/api/leads/' + id);
  const d = $('#drawer');
  const msOpen = (label, key) => `
    <div class="milestone ${l[key] ? 'done' : ''}">
      <div class="tick">${l[key] ? '✓' : ''}</div>
      <div><div class="name">${label}</div><div class="sub">${l[key] ? fmtDate(l[key]) : 'Not yet'}</div></div>
      <input type="date" data-ms="${key}" value="${dayOf(l[key])}" />
      ${l[key] ? `<button class="btn sm light" data-clear="${key}">Clear</button>` : `<button class="btn sm" data-today="${key}">Today</button>`}
    </div>`;
  d.innerHTML = `
    <div class="dhead">${avatar(l)}
      <div><div class="name" style="font-size:16px">${displayName(l)}</div>
      <div class="sub"><span class="plat ${l.platform}">${platLabel[l.platform]}</span>${l.username ? ' · @' + esc(l.username) : ''} · lead since ${fmtDate(l.created_at)}</div></div>
      <button class="x" id="closeD">×</button>
    </div>
    <div class="dbody">
      <div class="sec"><h3>Stage</h3>
        <div class="stepper">${CONFIG.statuses.map((s) => `<button class="step ${s.id} ${l.status === s.id ? 'active' : ''}" data-status="${s.id}">${s.label}</button>`).join('')}</div>
        <div class="grid2" style="margin-top:12px">${msOpen('Contacted', 'contacted_at')}${msOpen('Demo sent', 'demo_sent_at')}</div>
      </div>

      <div class="sec"><h3>Follow-ups</h3>
        <div class="list">${l.followups.length ? l.followups.map((f) => `
          <div class="item ${f.done_at ? 'done' : ''}">
            <input type="checkbox" data-fu="${f.id}" ${f.done_at ? 'checked' : ''} style="margin-top:3px" />
            <div class="grow"><div class="${f.done_at ? '' : fuClass(f.due_at)}">${fmtDate(f.due_at)}</div>${f.note ? `<div class="sub">${esc(f.note)}</div>` : ''}
              ${f.done_at ? `<div class="sub">Done ${fmtDate(f.done_at)}</div>` : ''}</div>
            <button class="del" data-delfu="${f.id}" title="Delete">🗑</button>
          </div>`).join('') : '<div class="sub">No follow-ups scheduled.</div>'}</div>
        <div class="addrow">
          <input type="date" id="fuDate" value="${new Date(Date.now() + 2 * 864e5).toLocaleDateString('en-CA')}" />
          <input type="text" id="fuNote" placeholder="What to follow up on (e.g. send pricing, call back)" />
          <button class="btn main sm" id="fuAdd">Add follow-up</button>
        </div>
        <div class="addrow" style="margin-top:6px">
          ${[1, 3, 7, 14].map((n) => `<button class="btn light sm" data-plus="${n}">+${n}d</button>`).join('')}
        </div>
      </div>

      <div class="sec"><h3>Notes & activity</h3>
        <div class="addrow" style="margin:0 0 10px">
          <textarea id="noteText" rows="2" placeholder="Add a note — requirements, budget, call summary…"></textarea>
        </div>
        <div class="addrow" style="margin:-4px 0 12px;align-items:center">
          <span class="sub">Date</span><input type="date" id="noteDate" value="${todayStr()}" />
          <button class="btn sm" id="noteAdd" style="margin-left:auto">Save note</button>
        </div>
        <div class="list">${l.notes.map((n) => `
          <div class="item ${n.kind}">
            <div class="grow"><div class="sub">${n.kind === 'activity' ? '⚙ ' : '📝 '}${fmtDateTime(n.created_at)}</div><div style="white-space:pre-wrap">${esc(n.text)}</div></div>
            ${n.kind === 'note' ? `<button class="del" data-delnote="${n.id}" title="Delete">🗑</button>` : ''}
          </div>`).join('')}</div>
      </div>

      <div class="sec"><h3>Details</h3>
        <div class="grid2">
          ${[['name', 'Name'], ['phone', 'Phone / WhatsApp'], ['email', 'Email'], ['business', 'Business'], ['interest', 'Interested in'], ['tags', 'Tags (comma separated)']]
            .map(([k, lab]) => `<label class="f">${lab}<input data-field="${k}" value="${esc(l[k] || '')}" /></label>`).join('')}
        </div>
        <div class="addrow" style="justify-content:space-between">
          <button class="btn light sm" id="delLead" style="color:var(--main)">Delete lead</button>
          <span>
            ${l.phone ? `<a class="btn light sm" style="text-decoration:none" target="_blank" href="https://wa.me/${esc(l.phone.replace(/\D/g, '').replace(/^0/, '92'))}">WhatsApp</a>` : ''}
            <a class="btn sm" style="text-decoration:none" target="_blank" href="https://business.facebook.com/latest/inbox">Reply in Meta inbox ↗</a>
          </span>
        </div>
      </div>

      <div class="sec"><h3>Conversation (${l.messages.length})</h3>
        <div class="chat" id="chat">${l.messages.length ? l.messages.map((m) => `<div class="bubble ${m.direction}">${esc(m.text)}<div class="t">${fmtDateTime(m.created_at)}</div></div>`).join('') : '<div class="sub">No messages stored.</div>'}</div>
      </div>
    </div>`;
  d.classList.remove('hidden'); $('#scrim').classList.remove('hidden');
  const chat = $('#chat'); chat.scrollTop = chat.scrollHeight;

  const patch = async (body, msg) => { await api('/api/leads/' + id, { method: 'PATCH', body }); if (msg) toast(msg); await refresh(true); openLead(id); };
  $('#closeD').onclick = closeLead;
  $$('[data-status]', d).forEach((b) => (b.onclick = () => patch({ status: b.dataset.status }, 'Stage: ' + statusLabel(b.dataset.status))));
  $$('[data-today]', d).forEach((b) => (b.onclick = () => patch({ [b.dataset.today]: new Date().toISOString() }, 'Saved')));
  $$('[data-clear]', d).forEach((b) => (b.onclick = () => patch({ [b.dataset.clear]: null }, 'Cleared')));
  $$('[data-ms]', d).forEach((inp) => (inp.onchange = () => patch({ [inp.dataset.ms]: dateToIso(inp.value) }, 'Date saved')));
  $$('[data-field]', d).forEach((inp) => (inp.onchange = () => patch({ [inp.dataset.field]: inp.value.trim() }, 'Saved')));
  $$('[data-plus]', d).forEach((b) => (b.onclick = () => { $('#fuDate').value = new Date(Date.now() + b.dataset.plus * 864e5).toLocaleDateString('en-CA'); $('#fuNote').focus(); }));
  $('#fuAdd').onclick = async () => {
    if (!$('#fuDate').value) return toast('Pick a date');
    await api(`/api/leads/${id}/followups`, { method: 'POST', body: { due_at: dateToIso($('#fuDate').value), note: $('#fuNote').value.trim() } });
    toast('Follow-up added'); await refresh(true); openLead(id);
  };
  $$('[data-fu]', d).forEach((cb) => (cb.onchange = async () => { await api('/api/followups/' + cb.dataset.fu, { method: 'PATCH', body: { done: cb.checked } }); await refresh(true); openLead(id); }));
  $$('[data-delfu]', d).forEach((b) => (b.onclick = async () => { await api('/api/followups/' + b.dataset.delfu, { method: 'DELETE' }); await refresh(true); openLead(id); }));
  $('#noteAdd').onclick = async () => {
    const text = $('#noteText').value.trim(); if (!text) return;
    const dv = $('#noteDate').value;
    const created = dv && dv !== todayStr() ? dateToIso(dv) : new Date().toISOString();
    await api(`/api/leads/${id}/notes`, { method: 'POST', body: { text, created_at: created } });
    toast('Note saved'); openLead(id); loadLeads();
  };
  $$('[data-delnote]', d).forEach((b) => (b.onclick = async () => { await api('/api/notes/' + b.dataset.delnote, { method: 'DELETE' }); openLead(id); }));
  $('#delLead').onclick = async () => {
    if ($('#delLead').dataset.confirm !== '1') { $('#delLead').dataset.confirm = '1'; $('#delLead').textContent = 'Tap again to delete'; return; }
    await api('/api/leads/' + id, { method: 'DELETE' }); closeLead(); toast('Lead deleted'); refresh(true);
  };
}
function closeLead() { CURRENT = null; $('#drawer').classList.add('hidden'); $('#scrim').classList.add('hidden'); }
$('#scrim').onclick = closeLead;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLead(); });

// ---- views / toolbar ----
function switchView(v) {
  VIEW = v;
  $$('.tab').forEach((t) => t.classList.toggle('active', t.dataset.view === v));
  ['leads', 'followups', 'pipeline'].forEach((x) => $('#view-' + x).classList.toggle('hidden', x !== v));
  if (v === 'followups') loadFollowups();
  if (v === 'pipeline') renderBoard();
}
$$('.tab').forEach((t) => (t.onclick = () => switchView(t.dataset.view)));
let st; $('#search').oninput = () => { clearTimeout(st); st = setTimeout(loadLeads, 250); };
$('#fStatus').onchange = loadLeads; $('#fPlatform').onchange = loadLeads; $('#fQuick').onchange = renderLeads;

$('#syncBtn').onclick = async () => {
  const b = $('#syncBtn'); b.disabled = true; b.textContent = 'Syncing…';
  try {
    const res = await api('/api/sync', { method: 'POST' });
    toast(res.map((r) => `${platLabel[r.platform]}: ${r.error ? 'error — ' + r.error : r.skipped ? r.skipped : `+${r.newLeads} leads, +${r.newMessages} msgs`}`).join(' | '));
    refresh(true);
  } catch (e) { toast(e.message); }
  b.disabled = false; b.textContent = '⟳ Sync inbox';
};
$('#exportBtn').onclick = async () => {
  const csv = await api('/api/export.csv');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `pokitbio-leads-${todayStr()}.csv`; a.click();
};
$('#addBtn').onclick = () => $('#addModal').classList.remove('hidden');
$('#addCancel').onclick = () => $('#addModal').classList.add('hidden');
$('#addForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  const { id } = await api('/api/leads', { method: 'POST', body });
  e.target.reset(); $('#addModal').classList.add('hidden'); toast('Lead added'); await refresh(true); openLead(id);
};

if (KEY) boot().catch(() => showLogin()); else showLogin();
</script>
</body>
</html>
